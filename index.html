<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#00aaff" />
  <meta name="description"
    content="LIFE OS — Gamified Life Management Operating System. Track quests, goals, stats, and economy." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="LIFE OS" />

  <!-- iOS PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LIFE OS" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- PRECONNECT OPTIMIZATION (v1.8.2) -->
  <link rel="preconnect" href="https://life-os-1e607.firebaseapp.com" crossorigin />
  <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <!-- Optimized: max 3 origins used -->

  <title>LIFE OS — Gamified Life Management</title>

  <!-- CRITICAL CSS (Inline) -->
  <style id="critical-css">
    :root {
      --system-dark: #0a0a0b;
      --system-blue: #00aaff;
      --system-panel: #111111;
      --system-text: #e0e0e0;
    }

    html,
    body {
      background-color: var(--system-dark);
      color: var(--system-text);
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    #root {
      height: 100%;
      width: 100%;
    }

    .initial-load {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: var(--system-dark);
    }

    .load-spinner {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(0, 170, 255, 0.2);
      border-top-color: var(--system-blue);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <!-- ASYNC CSS LOADING (v1.8.2) -->
  <script>
    // Prevent FOUC by making sure the body is visible immediately with critical styles
    document.documentElement.className = 'js-loading';
  </script>
</head>

<body>
  <div id="root">
    <div class="initial-load" id="system-init-loader">
      <div class="load-spinner"></div>
    </div>
  </div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
