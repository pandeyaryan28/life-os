<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#00aaff" />
  <meta name="description"
    content="LIFE OS — Gamified Life Management Operating System. Track quests, goals, stats, and economy." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="LIFE OS" />

  <!-- iOS PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LIFE OS" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- Favicon & Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- PRELOAD CRITICAL RESOURCES (v1.8.3) -->
  <link rel="preload" href="/src/main.tsx" as="script" crossorigin />
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@fontsource/inter/files/inter-latin-400-normal.woff2" as="font"
    type="font/woff2" crossorigin />
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/@fontsource/inter/files/inter-latin-700-normal.woff2" as="font"
    type="font/woff2" crossorigin />

  <noscript>
    <link rel="stylesheet" href="/src/index.css">
  </noscript>

  <!-- PRECONNECT OPTIMIZATION (v1.8.3) -->
  <link rel="preconnect" href="https://life-os-1e607.firebaseapp.com" crossorigin />
  <link rel="preconnect" href="https://firebase.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://apis.google.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://grainy-gradients.vercel.app" crossorigin />

  <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

  <title>LIFE OS — Gamified Life Management</title>

  <!-- CRITICAL CSS (Inline) -->
  <style id="critical-css">
    :root {
      --system-dark: #0a0a0b;
      --system-blue: #00aaff;
      --system-panel: #111111;
      --system-text: #e0e0e0;
      --system-border: #333333;
    }

    html,
    body {
      background-color: var(--system-dark);
      color: var(--system-text);
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, sans-serif;
      font-display: swap;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    /* APP SHELL STYLES */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      opacity: 0;
      animation: fadeIn 0.3s ease-out forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    .shell-header {
      height: 60px;
      border-bottom: 1px solid var(--system-border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: rgba(10, 10, 11, 0.8);
      backdrop-filter: blur(10px);
    }

    .shell-logo {
      font-weight: 900;
      font-style: italic;
      font-size: 20px;
      letter-spacing: -1px;
    }

    .shell-logo span {
      color: var(--system-blue);
    }

    .shell-content {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .skeleton {
      background: linear-gradient(90deg, #161618 25%, #1e1e21 50%, #161618 75%);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
      border-radius: 8px;
    }

    @keyframes shimmer {
      from {
        background-position: 200% 0;
      }

      to {
        background-position: -200% 0;
      }
    }

    .skeleton-card {
      height: 120px;
      width: 100%;
    }

    .skeleton-list {
      flex: 1;
      width: 100%;
    }

    #system-init-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      background: var(--system-dark);
    }

    .load-spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(0, 170, 255, 0.1);
      border-top-color: var(--system-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <script>
    // Flag to prevent layout shift during hydration
    window.__SHELL_LOADED__ = true;

    // Asynchronous CSS loading for non-critical styles
    window.addEventListener('load', () => {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = '/src/index.css';
      document.head.appendChild(link);
    });
  </script>
</head>

<body>
  <div id="root">
    <!-- STATIC APP SHELL (PRIORITIZED RENDER) -->
    <div class="app-shell" id="app-shell-static">
      <header class="shell-header">
        <div class="shell-logo">LIFE <span>OS</span></div>
      </header>
      <main class="shell-content">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-list"></div>
      </main>
    </div>

    <div id="system-init-loader">
      <div class="load-spinner"></div>
    </div>
  </div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
